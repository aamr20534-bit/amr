name: Build AMR DOCS APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck & Vite production build
        run: |
          npm run lint
          npm run build

      - name: Ensure Capacitor Android platform & sync assets
        run: |
          if [ ! -f android/gradlew ]; then
            cp -r android android_custom_backup
            npx cap add android
            cp -rn android_custom_backup/app/src/main/* android/app/src/main/ || true
            cp -f android_custom_backup/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            cp -f android_custom_backup/app/src/main/res/values/strings.xml android/app/src/main/res/values/strings.xml
            cp -f android_custom_backup/app/src/main/res/values/styles.xml android/app/src/main/res/values/styles.xml
            cp -f android_custom_backup/app/src/main/res/values/colors.xml android/app/src/main/res/values/colors.xml
            cp -f android_custom_backup/app/src/main/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
            cp -f android_custom_backup/app/src/main/res/drawable/splash.xml android/app/src/main/res/drawable/splash.xml
            rm -rf android_custom_backup
          fi
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload AMR DOCS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMR-DOCS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build & Sign Release APK (if signing secrets are configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f app/release.keystore

      - name: Upload Signed Release APK Artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AMR-DOCS-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
