# Builds the REAL Android app (Capacitor + AmrFSPlugin = "All files access") in the cloud.
# No PC / Android Studio needed: Actions tab -> "Build AMR APK" -> Run workflow -> download the APK from Artifacts.
name: Build AMR APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.1
      - run: npm install
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AMR-FILE-MANAGER-apk
          path: android/app/build/outputs/apk/debug/*.apk
